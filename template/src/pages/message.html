title: 代表挨拶
desc: {{company.name}} 代表からのメッセージ。
section: message
hero_en: <em>Message</em>
hero_jp: 代表挨拶
hero_accent: var(--red)
breadcrumb: Message
---
<section class="section section--tight">
  <div class="wrap message-layout">
    <aside class="profile-card reveal">
      <div class="photo photo--square"><img src="assets/img/placeholder.svg" alt="代表の写真"></div>
      <p class="profile-card__role">代表取締役</p>
      <p class="profile-card__name">代表 氏名</p>
      <p class="profile-card__en">Name</p>
    </aside>
    <div class="message-body reveal" data-delay="1">
      <p class="quote-big" style="margin-bottom:.8em">「ひとことメッセージ」</p>
      <p>ここに代表メッセージ本文を書きます。</p>
      <p class="pull">強調したい一文は、このように<br>赤い線付きで大きく表示できます。</p>
      <p>本文の続き。</p>
    </div>
  </div>
</section>

<section class="section section--ink">
  <div class="wrap">
    <div class="sec-head sec-head--center reveal"><p class="eyebrow" style="--accent: var(--yellow)">Numbers</p><h2 class="sec-title">数字で見る会社</h2></div>
    <div class="stats">
      <div class="stat reveal"><p class="stat__num"><span data-count="10">10</span><small>年</small></p><p class="stat__label">項目名</p></div>
      <div class="stat reveal" data-delay="1"><p class="stat__num"><span data-count="90">90</span><small>%</small></p><p class="stat__label">項目名</p></div>
      <div class="stat reveal" data-delay="2"><p class="stat__num"><span data-count="5">5</span><small>人</small></p><p class="stat__label">項目名</p></div>
    </div>
  </div>
</section>

{{CTA}}
