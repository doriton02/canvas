<section class="section section--tight">
  <div class="wrap">
    <div class="cta reveal">
      <p class="eyebrow" style="--accent: var(--yellow)">{{cta.eyebrow}}</p>
      <h2 class="cta__title">{{cta.title}}</h2>
      <p class="cta__copy">{{cta.copy}}</p>
      <a class="btn btn--light" href="{{cta.href}}">{{cta.button}} <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
