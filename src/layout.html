<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{base_url}}assets/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="{{theme_color}}">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v={{asset_version}}">
{{color_css}}
<script src="assets/js/main.js?v={{asset_version}}" defer></script>
</head>
<body data-section="{{section}}" data-mail-user="{{company.email_user}}" data-mail-host="{{company.email_host}}">
<a class="skip-link" href="#main">本文へスキップ</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="logo" href="index.html" aria-label="{{company.name}} トップページ">
      <span class="logo__mark">{{brand.name}}</span><span class="logo__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="logo__sub">{{brand.tagline}}</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="gnav" aria-label="メニューを開く"><span></span><span></span><span></span></button>
    <nav class="gnav" id="gnav" aria-label="グローバルナビゲーション">
      <ul>
{{nav}}
      </ul>
    </nav>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="site-footer__top">
      <div>
        <a class="logo" href="index.html" aria-label="{{company.name}} トップページ"><span class="logo__mark">{{brand.name}}</span><span class="logo__dots" aria-hidden="true"><i></i><i></i><i></i></span></a>
        <address class="site-footer__addr">{{company.name}}<br>〒{{company.zip}} {{company.address}}<br>TEL <a href="tel:{{tel_link}}">{{company.tel}}</a></address>
{{sns}}
      </div>
      <nav class="footer-nav" aria-label="フッターナビゲーション">
{{footer_nav}}
      </nav>
    </div>
    <div class="site-footer__bottom">
      <p>{{copyright}}</p>
      <p class="en">{{brand.tagline}}</p>
    </div>
  </div>
</footer>
<button class="to-top" type="button" aria-label="ページの先頭へ戻る">↑</button>
</body>
</html>
